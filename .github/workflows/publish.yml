name: Publish CAD website

on:
  push:
    branches: [main]
    paths:
      - "source/**"
      - "scripts/build_site.py"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install pinned dependencies
        working-directory: source
        run: npm ci
      - name: Verify engine lifecycle and precise geometry
        working-directory: source
        run: |
          npm run check
          npm run test:engine
          npm run test:geometry
          npm run test:slices
      - name: Build CAD website
        working-directory: source
        run: npm run build -- --base=./
      - name: Prepare independent Pages files
        run: python3 scripts/build_site.py
      - name: Save published build in this repository
        run: |
          git add site migration-manifest.json index.html assets .nojekyll
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Store verified CAD build"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify public website and all CAD assets
        shell: python
        run: |
          import hashlib
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path
          files = json.loads(Path("migration-manifest.json").read_text())["files"]
          for path, expected in files.items():
              for attempt in range(12):
                  try:
                      url = "https://anney0117.github.io/" + path + "?verify=" + os.environ["GITHUB_SHA"]
                      request = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
                      with urllib.request.urlopen(request, timeout=60) as response:
                          actual = response.read(32 * 1024 * 1024)
                      if hashlib.sha256(actual).hexdigest() != expected["sha256"]:
                          raise RuntimeError("Published bytes do not match: " + path)
                      print("Verified", path, len(actual))
                      break
                  except Exception:
                      if attempt == 11:
                          raise
                      time.sleep(5)
