name: Publish CAD website

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/publish.yml"
      - "site/**"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration script
        run: python3 -m py_compile scripts/import_site.py
      - name: Import or validate the independent CAD build
        run: |
          python3 scripts/import_site.py
          mkdir -p site/assets
          cp index.html site/index.html
          cp -R assets/. site/assets/
          touch site/.nojekyll
      - name: Keep an independent copy in this repository
        run: |
          git add site migration-manifest.json index.html assets .nojekyll
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Store validated CAD static website"
            git push origin HEAD:main
          fi
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
