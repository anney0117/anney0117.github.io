name: Publish CAD website

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/publish.yml"
      - "site/**"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration script
        run: python3 -m py_compile scripts/import_site.py
      - name: Import or validate the independent CAD build
        run: |
          python3 scripts/import_site.py
          mkdir -p site/assets
          cp index.html site/index.html
          cp -R assets/. site/assets/
          touch site/.nojekyll
      - name: Keep an independent copy in this repository
        run: |
          git add site migration-manifest.json index.html assets .nojekyll
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Store validated CAD static website"
            git push origin HEAD:main
          fi
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify public website and all CAD assets
        shell: python
        run: |
          import hashlib
          import json
          import time
          import urllib.request
          from pathlib import Path
          files = json.loads(Path("migration-manifest.json").read_text())["files"]
          for path, expected in files.items():
              for attempt in range(12):
                  try:
                      url = "https://anney0117.github.io/" + path + "?cad_verify=18edba49"
                      request = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
                      with urllib.request.urlopen(request, timeout=60) as response:
                          actual = response.read(32 * 1024 * 1024)
                      if hashlib.sha256(actual).hexdigest() != expected["sha256"]:
                          raise RuntimeError("Published bytes do not match: " + path)
                      print("Verified", path, len(actual))
                      break
                  except Exception:
                      if attempt == 11:
                          raise
                      time.sleep(5)
